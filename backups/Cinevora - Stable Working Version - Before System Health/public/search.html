<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Catalog — Cinevora</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <script type="module" src="/js/ads.js"></script>
</head>
<body>
  <div class="ambient-bg"></div>

  <header class="site-header scrolled">
    <div class="container header-inner">
      <a href="/" class="brand-logo">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </div>
        CINE<span>VORA</span>
      </a>

      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/anime.html">Anime</a></li>
        <li><a href="/movies.html">Movies</a></li>
        <li><a href="/series.html">Series</a></li>
        <li><a href="/search.html" class="active">Search</a></li>
      </ul>

      <div class="header-actions">
        <div id="header-user-actions"></div>
        <button class="mobile-toggle" aria-label="Toggle menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container" style="margin-top: 7rem; margin-bottom: 4rem;">
    <!-- Ad Slot SEARCH_TOP -->
    <div data-ad-slot="SEARCH_TOP"></div>

    <!-- Large Search Header -->
    <div class="glass-panel" style="padding: 2.5rem; border-radius: 20px; margin-bottom: 2.5rem; text-align: center;">
      <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 1rem;">Search Anime, Movies & Series</h1>
      <div style="position: relative; max-width: 640px; margin: 0 auto;">
        <input type="text" id="main-search-input" placeholder="Type a title, keyword, or genre (e.g. Cyberpulse, Sci-Fi)..." style="width: 100%; background: var(--bg-dark); border: 2px solid var(--border-glass); color: #fff; padding: 1.1rem 1.5rem; border-radius: 14px; font-size: 1.05rem; outline: none; transition: var(--transition);">
      </div>
    </div>

    <div class="section-header">
      <h2 class="section-title" id="search-results-heading">Search Results</h2>
    </div>

    <div class="anime-grid" id="search-results-grid">
      <div class="state-box glass-panel" style="grid-column: 1 / -1;">
        <p style="color: var(--text-muted);">Enter a query above to explore the database.</p>
      </div>
    </div>

    <!-- Ad Slot SEARCH_BOTTOM -->
    <div data-ad-slot="SEARCH_BOTTOM"></div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <div>&copy; 2026 Cinevora.</div>
    </div>
  </footer>

  <script type="module">
    import { API } from '/js/api.js?v=3';
    import { createAnimeCard } from '/js/app.js';

    const searchInput = document.getElementById('main-search-input');
    const resultsGrid = document.getElementById('search-results-grid');
    const heading = document.getElementById('search-results-heading');

    const urlParams = new URLSearchParams(window.location.search);
    const initialQuery = urlParams.get('q') || '';

    if (initialQuery) {
      searchInput.value = initialQuery;
      performSearch(initialQuery);
    }

    let timer;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(timer);
      const val = e.target.value.trim();
      timer = setTimeout(() => {
        performSearch(val);
      }, 300);
    });

    async function performSearch(q) {
      if (!q) {
        heading.textContent = 'Search Results';
        resultsGrid.innerHTML = `
          <div class="state-box glass-panel" style="grid-column: 1 / -1;">
            <p style="color: var(--text-muted);">Type a search query above to browse matching content.</p>
          </div>
        `;
        return;
      }

      heading.textContent = `Search Results for "${q}"`;
      resultsGrid.innerHTML = `<div class="state-box" style="grid-column: 1 / -1;"><div class="spinner"></div></div>`;

      try {
        const data = await API.search(q);
        if (data.results.length === 0) {
          resultsGrid.innerHTML = `
            <div class="state-box glass-panel" style="grid-column: 1 / -1; padding: 3rem;">
              <h3>No anime found for "${q}"</h3>
              <p style="color: var(--text-muted); margin-top: 0.5rem;">Check your spelling or search for broader genres like Action or Sci-Fi.</p>
            </div>
          `;
        } else {
          resultsGrid.innerHTML = data.results.map(item => createAnimeCard(item)).join('');
        }
      } catch (e) {
        resultsGrid.innerHTML = `<div class="state-box" style="grid-column: 1 / -1; color: #ef4444;">Error retrieving search results.</div>`;
      }
    }
  </script>
</body>
</html>
