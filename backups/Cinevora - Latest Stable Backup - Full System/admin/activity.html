<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audit Logs — Cinevora Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .admin-layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
    .admin-sidebar { background: rgba(10, 13, 26, 0.95); border-right: 1px solid var(--border-glass); padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; }
    .admin-nav { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
    .admin-nav a { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 0.9rem; border-radius: var(--radius-sm); }
    .admin-nav a:hover, .admin-nav a.active { background: rgba(147, 51, 234, 0.15); color: #fff; border-left: 3px solid var(--accent-purple); }
    .admin-main { padding: 2.5rem; min-width: 0; }
    .log-item { display: flex; align-items: center; justify-content: space-between; padding: 1rem; border-bottom: 1px solid var(--border-glass); font-size: 0.9rem; }

    @media (max-width: 768px) {
      .admin-layout { display: flex; flex-direction: column; width: 100%; max-width: 100%; overflow-x: hidden; }
      .admin-sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border-glass); padding: 1rem; gap: 0.75rem; }
      .admin-nav { flex-direction: row; flex-wrap: wrap; gap: 0.35rem 0.5rem; }
      .admin-nav a { padding: 0.4rem 0.75rem; font-size: 0.8rem; border-left: none; border-bottom: 2px solid transparent; }
      .admin-nav a.active { border-left: none; border-bottom: 2px solid var(--accent-purple); }
      .admin-main { padding: 1rem; width: 100%; max-width: 100%; box-sizing: border-box; overflow-x: hidden; }
      .admin-main > div:first-child { flex-direction: column; align-items: flex-start; gap: 0.75rem; margin-bottom: 1.25rem; }
      .admin-main h1 { font-size: 1.5rem !important; }
      .glass-panel { padding: 1rem !important; border-radius: 12px !important; }
      .log-item { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="/" class="brand-logo">
        <div class="brand-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
        CINE<span>VORA</span>
      </a>
      <ul class="admin-nav">
        <li><a href="/admin/admin.html">📊 Dashboard Overview</a></li>
        <li><a href="/admin/health.html">🛡️ System Health & Protection</a></li>
        <li><a href="/admin/add-anime.html">➕ Add Content</a></li>
        <li><a href="/admin/manage-anime.html">🎬 Manage Anime</a></li>
        <li><a href="/admin/manage-users.html">👥 User Management</a></li>
        <li><a href="/admin/ads.html">📢 Ads Manager</a></li>
        <li><a href="/admin/activity.html" class="active">📜 Audit Logs</a></li>
        <li><a href="/admin/settings.html">⚙️ Settings</a></li>
      </ul>
    </aside>

    <main class="admin-main">
      <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 2rem; font-weight: 800;">System Audit Logs</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Real-time administrative actions, content publishes, and account logins</p>
      </div>

      <div class="glass-panel" style="padding: 1.5rem; border-radius: 16px;" id="logs-container">
        <div class="spinner"></div>
      </div>
    </main>
  </div>

  <script type="module">
    import { API } from '/js/api.js';

    async function loadLogs() {
      const container = document.getElementById('logs-container');
      try {
        const { logs } = await API.getAuditLogs();
        if (!logs || logs.length === 0) {
          container.innerHTML = `<div style="text-align:center; padding: 2rem; color: var(--text-muted);">No system activity recorded yet.</div>`;
          return;
        }

        container.innerHTML = logs.map(l => `
          <div class="log-item">
            <div style="display: flex; align-items: center; gap: 1rem;">
              <span class="badge badge-purple" style="font-size: 0.7rem;">${l.action}</span>
              <div>
                <div style="font-weight: 600; color: #fff;">${l.details}</div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">By ${l.username} • IP: ${l.ip || '127.0.0.1'}</div>
              </div>
            </div>
            <div style="font-size: 0.8rem; color: var(--text-dim);">${new Date(l.created_at).toLocaleString()}</div>
          </div>
        `).join('');

      } catch (err) {
        container.innerHTML = `<div style="text-align:center; color:#ef4444; padding:2rem;">Failed to fetch audit activity logs.</div>`;
      }
    }

    loadLogs();
  </script>
</body>
</html>
