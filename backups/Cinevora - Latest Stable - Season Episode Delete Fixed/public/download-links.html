<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download Mirrors — Cinevora</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <script type="module" src="/js/ads.js"></script>
  <style>
    .links-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2rem 1.5rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      max-width: 820px;
      margin: 0 auto;
    }
    .link-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      transition: all 0.25s ease;
    }
    .link-item:hover {
      border-color: rgba(168, 85, 247, 0.4);
      background: rgba(255, 255, 255, 0.06);
      transform: translateY(-2px);
    }
    .host-badge {
      background: rgba(147, 51, 234, 0.2);
      color: #c084fc;
      border: 1px solid rgba(147, 51, 234, 0.3);
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>

  <header class="site-header scrolled">
    <div class="container header-inner" style="justify-content: center;">
      <a href="/" class="brand-logo" style="margin: 0 auto;">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </div>
        CINE<span>VORA</span>
      </a>
    </div>
  </header>

  <main class="container" style="margin-top: 5rem; margin-bottom: 4rem;">
    <!-- Top Ad Placements -->
    <div data-ad-slot="DOWNLOAD_PAGE_TOP"></div>

    <div id="links-content-container" style="margin: 1.5rem auto;">
      <div class="state-box"><div class="spinner"></div></div>
    </div>

    <!-- Bottom Ad Placements -->
    <div data-ad-slot="DOWNLOAD_GATEWAY_BOTTOM"></div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom" style="text-align: center;">
      <div>&copy; 2026 Cinevora. Fast Authorized Media Mirrors.</div>
    </div>
  </footer>

  <script type="module">
    import { API } from '/js/api.js';
    import { CinevoraAds } from '/js/ads.js';

        const urlParams = new URLSearchParams(window.location.search);
    const animeId = urlParams.get('id');
    const episodeId = urlParams.get('ep');
    const qualityId = urlParams.get('q');
    const mirrorId = urlParams.get('m');

    async function loadDownloadLinksPage() {
      const container = document.getElementById('links-content-container');
      if (!animeId) {
        container.innerHTML = `<div class="links-card" style="text-align:center;"><h3>No title specified.</h3><a href="/" class="btn btn-primary" style="margin-top:1rem;">Back to Catalog</a></div>`;
        return;
      }

      try {
        const { anime, episodes } = await API.getAnimeById(animeId);
        const pageSettings = await API.getPageSettings();

        const stg4 = pageSettings?.final_download_links || {
          title: 'Authorized Download Links',
          heading: 'AVAILABLE DOWNLOAD MIRRORS',
          description: 'Select an authorized mirror host below to start your direct download.',
          custom_text: 'All mirror links are verified for maximum speed and availability.'
        };

        let links = [];
        let epObj = null;

        if (episodeId) {
          epObj = (episodes || []).find(e => e.id === episodeId);
          const epLinksRes = await API.getEpisodeDownloadLinks(episodeId);
          links = epLinksRes.links || [];
        } else {
          const contentLinksRes = await API.getDownloadLinks(animeId);
          links = contentLinksRes.links || [];
        }

        
                let activeLinks = [];
        if (qualityId && epObj && epObj.qualities) {
          const qObj = epObj.qualities.find(q => q.id === qualityId);
          if (qObj) {
            if (mirrorId && qObj.mirrors) {
              const mObj = qObj.mirrors.find(m => m.id === mirrorId);
              if (mObj && mObj.url) {
                activeLinks.push({
                  host_name: mObj.name,
                  label: `${qObj.quality} Direct Download`,
                  url: mObj.url
                });
              }
            } else if (qObj.video_url) {
              activeLinks.push({
                host_name: 'Google Drive',
                label: `${qObj.quality} Direct Download`,
                url: qObj.video_url
              });
            }
          }
        }
        
        if (activeLinks.length === 0) {
          activeLinks = links.filter(l => l.enabled !== false);
        }

        const titleText = epObj ? `${anime.title} — ${epObj.season_number ? `Season ${epObj.season_number} ` : ''}Episode ${epObj.episode_number}: ${epObj.title}` : anime.title;

        document.title = `${stg4.title || 'Download Mirrors'} — ${titleText} | Cinevora`;

        container.innerHTML = `
          <div class="links-card">
            <h1 style="font-size: 1.6rem; font-weight: 800; color: #f8fafc; margin-bottom: 0.3rem; text-align: center;">
              Download Mirrors: ${titleText}
            </h1>
            <p style="color: #94a3b8; font-size: 0.9rem; text-align: center; margin-bottom: 1.5rem;">
              ${stg4.description}
            </p>

            <!-- Above Links Ad Slot -->
            <div data-ad-slot="DOWNLOAD_ABOVE_BUTTON"></div>

            <h3 style="font-size: 1.1rem; font-weight: 800; color: #f8fafc; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              ${stg4.heading || 'DOWNLOAD LINKS'}
            </h3>

            <div style="display: flex; flex-direction: column; gap: 1rem;">
              ${activeLinks.length > 0 ? activeLinks.map((link, index) => `
                <div class="link-item">
                  <div style="display: flex; flex-direction: column; gap: 0.3rem;">
                    <div style="display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;">
                      <span class="host-badge">${link.host_name}</span>
                      <strong style="color: #f8fafc; font-size: 1.05rem;">${link.label}</strong>
                    </div>
                    <div style="font-size: 0.8rem; color: #94a3b8;">High-speed encrypted mirror link</div>
                  </div>

                  <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="btn btn-primary" style="padding: 0.65rem 1.6rem; font-weight: 800; font-size: 0.9rem; gap: 0.4rem;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                    DOWNLOAD NOW
                  </a>
                </div>

                ${index === 0 ? '<div data-ad-slot="DOWNLOAD_BETWEEN_COUNTDOWNS" style="margin: 1rem 0;"></div>' : ''}
              `).join('') : `
                <div style="padding: 2.5rem 1.5rem; text-align: center; color: #f87171; font-weight: 700; font-size: 1rem; background: rgba(239, 68, 68, 0.08); border: 1px dashed rgba(239, 68, 68, 0.3); border-radius: 12px;">
                  No active download links available for this item.
                </div>
              `}
            </div>

            <!-- Below Links Ad Slot -->
            <div data-ad-slot="DOWNLOAD_BELOW_BUTTON" style="margin-top: 1.5rem;"></div>

            ${stg4.custom_text ? `<div style="font-size:0.82rem; color:#64748b; text-align:center; margin-top:1.5rem;">${stg4.custom_text}</div>` : ''}

            <div style="margin-top: 2rem; text-align: center;">
              <a href="/details.html?id=${anime.id}" class="btn btn-glass" style="font-size: 0.85rem;">
                &larr; Back to Details Page
              </a>
            </div>
          </div>
        `;

        // Render ads in newly created slots
        if (CinevoraAds && typeof CinevoraAds.initAllSlots === 'function') {
          CinevoraAds.initAllSlots();
        }

      } catch (err) {
        container.innerHTML = `<div class="links-card" style="color:#ef4444;">Failed to load download mirrors: ${err.message}</div>`;
      }
    }

    loadDownloadLinksPage();
  </script>
</body>
</html>
