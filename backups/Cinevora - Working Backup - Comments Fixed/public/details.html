<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime Details — Cinevora</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <script type="module" src="/js/ads.js"></script>
</head>
<body>
  <div class="ambient-bg"></div>

  <header class="site-header scrolled">
    <div class="container header-inner">
      <a href="/" class="brand-logo">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </div>
        CINE<span>VORA</span>
      </a>

      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/anime.html">Anime</a></li>
        <li><a href="/movies.html">Movies</a></li>
        <li><a href="/series.html">Series</a></li>
        <li><a href="/search.html">Search</a></li>
      </ul>

      <div class="header-actions">
        <button class="search-trigger">Search...</button>
        <div id="header-user-actions"></div>
        <button class="mobile-toggle" aria-label="Toggle menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div id="details-view-container" style="margin-top: 5rem;">
    <div class="state-box"><div class="spinner"></div></div>
  </div>

  <!-- Lightbox Modal -->
  <div id="lightbox-modal" class="lightbox-modal">
    <button id="lightbox-close" class="lightbox-close" aria-label="Close Lightbox">✕</button>
    <button id="lightbox-prev" class="lightbox-nav lightbox-prev" aria-label="Previous Screenshot">‹</button>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="Screenshot Fullview" class="lightbox-img">
    </div>
    <button id="lightbox-next" class="lightbox-nav lightbox-next" aria-label="Next Screenshot">›</button>
    <div id="lightbox-counter" class="lightbox-counter">1 / 1</div>
  </div>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <div>&copy; 2026 Cinevora.</div>
    </div>
  </footer>

  <script type="module">
    import { API } from '/js/api.js?v=3';
    import { createAnimeCard, openTrailerModal } from '/js/app.js';

    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');

    let activeScreenshots = [];
    let currentLightboxIndex = 0;

    async function loadDetails() {
      const container = document.getElementById('details-view-container');
      if (!id) {
        container.innerHTML = `<div class="container state-box glass-panel" style="margin-top: 4rem;">Anime ID not provided. <a href="/" class="btn btn-primary" style="margin-top:1rem;">Back Home</a></div>`;
        return;
      }

      try {
        const { anime, episodes, related, screenshots: inlineScreenshots } = await API.getAnimeById(id);
        document.title = `${anime.title} — Cinevora`;

        if (inlineScreenshots && Array.isArray(inlineScreenshots) && inlineScreenshots.length > 0) {
          activeScreenshots = inlineScreenshots;
        }

        // Fetch Screenshots for this content
        try {
          const scrData = await API.getAnimeScreenshots(anime.id || id);
          if (scrData && scrData.screenshots && scrData.screenshots.length > 0) {
            activeScreenshots = scrData.screenshots;
          }
        } catch (e) {
          console.error('Failed to load screenshots:', e);
        }

        // Check Watchlist state if logged in
        let inWatchlist = false;
        try {
          const wl = await API.getWatchlist();
          if (wl.watchlist) {
            inWatchlist = wl.watchlist.some(w => w.id === anime.id);
          }
        } catch {}

        container.innerHTML = `
          <!-- Backdrop Hero Header -->
          <div class="detail-hero">
            <img src="${anime.banner || anime.banner_image_url || anime.backdrop || anime.poster}" alt="${anime.title}" class="detail-backdrop">
            <div class="hero-overlay"></div>

            <div class="container detail-container">
              <img src="${anime.poster}" alt="${anime.title}" class="detail-poster">

              <div class="detail-info">
                <div class="hero-meta">
                  <span class="badge badge-purple">${anime.type}</span>
                  <span class="badge badge-blue">${anime.status}</span>
                  <span style="color: #fbbf24; font-weight: 700;">⭐ ${anime.rating} / 10</span>
                  <span>${anime.year}</span>
                  <span>${anime.language}</span>
                </div>

                <h1 class="detail-title">${anime.title}</h1>
                <p style="color: var(--text-muted); font-size: 1.05rem; line-height: 1.6; max-width: 780px;">${anime.description}</p>

                <div class="hero-meta" style="margin-top: 0.5rem;">
                  <span style="color: var(--text-dim);">Genres:</span>
                  ${anime.genres.map(g => `<a href="/anime.html?genre=${g}" class="badge badge-purple" style="text-decoration:none;">${g}</a>`).join('')}
                </div>

                <div class="detail-actions">
                  <a href="/watch.html?id=${anime.id}" class="btn btn-primary" style="padding: 0.8rem 1.8rem; font-size: 1rem;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    Watch Now
                  </a>
                  <a href="/download-gateway.html?id=${anime.id}" class="btn btn-glass" style="padding: 0.8rem 1.5rem; border-color: rgba(56, 189, 248, 0.4); color: #38bdf8;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Download
                  </a>
                  ${anime.trailer_url ? `
                    <button id="trailer-btn" class="btn btn-glass" style="padding: 0.8rem 1.5rem;">
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
                      Watch Trailer
                    </button>
                  ` : ''}
                  <button id="watchlist-toggle-btn" class="btn btn-glass" style="padding: 0.8rem 1.5rem;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="${inWatchlist ? '#9333ea' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                    ${inWatchlist ? 'In Watchlist' : 'Add to Watchlist'}
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Main Detail Tabs, Screenshots & Episodes -->
          <div class="container" style="margin-bottom: 4rem;">
            <!-- Ad Slot DETAILS_TOP -->
            <div data-ad-slot="DETAILS_TOP"></div>

            <!-- Screenshots Gallery Section -->
            ${activeScreenshots && activeScreenshots.length > 0 ? `
              <section class="screenshot-gallery-section">
                <div class="section-header" style="margin-bottom: 1rem;">
                  <h3 class="section-title" style="display:flex; align-items:center; gap:0.5rem;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    SCREENSHOTS
                  </h3>
                </div>

                <div class="screenshot-grid">
                  ${activeScreenshots.map((scr, idx) => `
                    <div class="screenshot-card" data-index="${idx}">
                      <img src="${scr.image_url}" alt="${anime.title} Screenshot ${idx + 1}" class="screenshot-img" loading="lazy" onerror="this.onerror=null; this.src='https://placehold.co/600x337/0f172a/a855f7?text=Image+Unavailable';">
                      <div class="screenshot-overlay">
                        <div class="zoom-icon">
                          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                        </div>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </section>
            ` : ''}

            ${episodes && episodes.length > 0 ? `
              <div class="episodes-drawer">
                <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem;">
                  <h3 class="section-title">Episodes (${episodes.length})</h3>
                  <div id="season-tabs" style="display: flex; gap: 0.5rem; flex-wrap: wrap;"></div>
                </div>
                <div id="episodes-grid" class="episode-grid"></div>
              </div>
            ` : ''}

            <!-- Ad Slot DETAILS_MIDDLE -->
            <div data-ad-slot="DETAILS_MIDDLE"></div>

            <!-- Recommendations -->
            ${related && related.length > 0 ? `
              <section style="margin-top: 3.5rem;">
                <div class="section-header">
                  <h3 class="section-title">You Might Also Like</h3>
                </div>
                <div class="anime-grid">
                  ${related.map(item => `
                    <a href="/details.html?id=${item.id}" class="anime-card" style="text-decoration:none;">
                      <img src="${item.poster}" alt="${item.title}" class="anime-poster">
                      <div class="anime-card-content">
                        <div class="anime-title">${item.title}</div>
                        <div class="anime-meta">
                          <span>${item.type}</span>
                          <span style="color:#fbbf24;">⭐ ${item.rating}</span>
                        </div>
                      </div>
                    </a>
                  `).join('')}
                </div>
              </section>
            ` : ''}

            
          <!-- Comments Section -->
          <div class="glass-panel" style="margin-top: 2rem; padding: 1.5rem; border-radius: 16px;">
            <h3 style="font-size: 1.25rem; font-weight: 700; color: #f8fafc; margin-bottom: 1.5rem;">Comments</h3>
            <div id="comments-container">
              <div style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem;">
                <input type="text" id="comment-username" placeholder="Your Name" class="form-control" style="background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); padding: 0.75rem; border-radius: 8px; color: #fff;">
                <textarea id="comment-text" placeholder="Write a comment..." class="form-control" rows="3" style="background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); padding: 0.75rem; border-radius: 8px; color: #fff; resize: vertical;"></textarea>
                <div style="text-align: right;">
                  <button type="button" id="post-comment-btn" class="btn btn-primary" style="padding: 0.6rem 1.5rem;">Post Comment</button>
                </div>
              </div>
              <div id="comments-list" style="display: flex; flex-direction: column; gap: 1rem;">
                <!-- Comments will be rendered here -->
              </div>
            </div>
          </div>

            <!-- Ad Slot DETAILS_BOTTOM -->
            <div data-ad-slot="DETAILS_BOTTOM"></div>
          </div>
        `;

        // Attach Trailer Action
        const trailerBtn = document.getElementById('trailer-btn');
        if (trailerBtn) {
          trailerBtn.addEventListener('click', () => {
            openTrailerModal(anime.title, anime.trailer_url);
          });
        }

        
        // Comments Logic
        const commentsList = document.getElementById('comments-list');
        const postBtn = document.getElementById('post-comment-btn');
        
        async function loadComments() {
          const res = await API.getComments(anime.id);
          if (res.comments) {
            if (res.comments.length === 0) {
              commentsList.innerHTML = '<div style="color: #64748b; text-align: center; padding: 1rem;">No comments yet. Be the first to comment!</div>';
            } else {
              commentsList.innerHTML = res.comments.map(c => `
                <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); padding: 1rem; border-radius: 12px;">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <strong style="color: #38bdf8; font-size: 1rem;">${c.username}</strong>
                    <span style="color: #64748b; font-size: 0.8rem;">${new Date(c.created_at).toLocaleString()}</span>
                  </div>
                  <p style="color: #cbd5e1; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap;">${c.content}</p>
                </div>
              `).join('');
            }
          }
        }
        
        if (postBtn) {
          postBtn.addEventListener('click', async () => {
            const usernameInput = document.getElementById('comment-username');
            const contentInput = document.getElementById('comment-text');
            const username = usernameInput.value.trim();
            const content = contentInput.value.trim();
            
            if (!username) return alert('Please enter a name');
            if (!content) return alert('Please enter a comment');
            
            postBtn.disabled = true;
            postBtn.innerText = 'Posting...';
            
            const res = await API.postComment(anime.id, username, content);
            if (res.error) {
              alert(res.error);
            } else {
              contentInput.value = '';
              await loadComments();
            }
            
            postBtn.disabled = false;
            postBtn.innerText = 'Post Comment';
          });
        }
        
        await loadComments();

        // Attach Watchlist Action
        const wlBtn = document.getElementById('watchlist-toggle-btn');
        if (wlBtn) {
          wlBtn.addEventListener('click', async () => {
            try {
              const res = await API.toggleWatchlist(anime.id);
              if (res.error) {
                alert(res.error);
                return;
              }
              inWatchlist = res.inWatchlist;
              wlBtn.innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="${inWatchlist ? '#9333ea' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                ${inWatchlist ? 'In Watchlist' : 'Add to Watchlist'}
              `;
            } catch {
              alert('Please sign in to save anime to your watchlist.');
            }
          });
        }

        // Populate Seasons & Episodes
        if (episodes && episodes.length > 0) {
          const seasonTabsContainer = document.getElementById('season-tabs');
          const episodesGridContainer = document.getElementById('episodes-grid');

          if (seasonTabsContainer && episodesGridContainer) {
            // Get unique season numbers
            const seasonNumbers = Array.from(new Set(episodes.map(e => e.season_number || 1))).sort((a, b) => a - b);

            function renderEpisodesForSeason(seasonNum) {
              const filtered = seasonNum === 'ALL' ? episodes : episodes.filter(e => (e.season_number || 1) === seasonNum);
              episodesGridContainer.innerHTML = filtered.map(ep => `
                <a href="/watch.html?id=${anime.id}&ep=${ep.id}" class="episode-card">
                  <img src="${ep.thumbnail || anime.poster}" alt="${ep.title}" class="episode-thumb" onerror="this.onerror=null; this.src='${anime.poster}';">
                  <div class="episode-meta">
                    <div class="episode-title">${ep.title}</div>
                    <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem;">
                      ${ep.season_number ? `S${ep.season_number} ` : ''}Ep ${ep.episode_number} • ${ep.duration || '24m'}
                    </div>
                  </div>
                </a>
              `).join('');

              // Update active tab styling
              seasonTabsContainer.querySelectorAll('.season-tab-btn').forEach(btn => {
                const bSeason = btn.dataset.season;
                if (bSeason === String(seasonNum)) {
                  btn.classList.add('btn-primary');
                  btn.classList.remove('btn-glass');
                } else {
                  btn.classList.remove('btn-primary');
                  btn.classList.add('btn-glass');
                }
              });
            }

            if (seasonNumbers.length > 1) {
              seasonTabsContainer.innerHTML = `
                <button class="btn btn-primary season-tab-btn" data-season="ALL" style="padding: 0.4rem 0.9rem; font-size: 0.8rem;">All Seasons</button>
                ${seasonNumbers.map(sNum => `
                  <button class="btn btn-glass season-tab-btn" data-season="${sNum}" style="padding: 0.4rem 0.9rem; font-size: 0.8rem;">Season ${sNum}</button>
                `).join('')}
              `;
            } else {
              seasonTabsContainer.innerHTML = `
                <button class="btn btn-primary season-tab-btn" data-season="${seasonNumbers[0] || 1}" style="padding: 0.4rem 0.9rem; font-size: 0.8rem;">Season ${seasonNumbers[0] || 1}</button>
              `;
            }

            seasonTabsContainer.querySelectorAll('.season-tab-btn').forEach(btn => {
              btn.addEventListener('click', () => {
                const sVal = btn.dataset.season;
                renderEpisodesForSeason(sVal === 'ALL' ? 'ALL' : parseInt(sVal, 10));
              });
            });

            // Initial render default to first season or All
            renderEpisodesForSeason(seasonNumbers[0] || 1);
          }
        }

        // Attach Screenshot Click Handlers
        const screenshotCards = document.querySelectorAll('.screenshot-card');
        screenshotCards.forEach(card => {
          card.addEventListener('click', () => {
            const idx = parseInt(card.getAttribute('data-index'), 10);
            openLightbox(idx);
          });
        });

      } catch (err) {
        console.error(err); container.innerHTML = `<div class="container state-box glass-panel" style="margin-top:4rem; color:#ef4444;">Failed to load anime details: ${err.message || err}</div>`;
      }
    }

    // --- LIGHTBOX CONTROLLER ---
    const modal = document.getElementById('lightbox-modal');
    const modalImg = document.getElementById('lightbox-img');
    const modalClose = document.getElementById('lightbox-close');
    const modalPrev = document.getElementById('lightbox-prev');
    const modalNext = document.getElementById('lightbox-next');
    const modalCounter = document.getElementById('lightbox-counter');

    function openLightbox(index) {
      if (!activeScreenshots || activeScreenshots.length === 0) return;
      currentLightboxIndex = index;
      updateLightboxContent();
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }

    function updateLightboxContent() {
      if (currentLightboxIndex < 0) currentLightboxIndex = activeScreenshots.length - 1;
      if (currentLightboxIndex >= activeScreenshots.length) currentLightboxIndex = 0;

      const currentScr = activeScreenshots[currentLightboxIndex];
      modalImg.src = currentScr.image_url;
      modalCounter.innerText = `${currentLightboxIndex + 1} / ${activeScreenshots.length}`;
    }

    function prevLightbox() {
      currentLightboxIndex--;
      updateLightboxContent();
    }

    function nextLightbox() {
      currentLightboxIndex++;
      updateLightboxContent();
    }

    modalClose.addEventListener('click', closeLightbox);
    modalPrev.addEventListener('click', prevLightbox);
    modalNext.addEventListener('click', nextLightbox);

    modal.addEventListener('click', (e) => {
      if (e.target === modal || e.target.classList.contains('lightbox-content')) {
        closeLightbox();
      }
    });

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      if (!modal.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') prevLightbox();
      if (e.key === 'ArrowRight') nextLightbox();
    });

    // Mobile Swipe Support
    let touchStartX = 0;
    let touchEndX = 0;

    modal.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    modal.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const swipeDistance = touchEndX - touchStartX;
      if (Math.abs(swipeDistance) > 40) {
        if (swipeDistance < 0) {
          nextLightbox(); // swipe left -> next
        } else {
          prevLightbox(); // swipe right -> prev
        }
      }
    }

    loadDetails();
  </script>
</body>
</html>
