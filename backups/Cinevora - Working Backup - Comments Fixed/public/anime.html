<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime Catalog — Cinevora</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <script type="module" src="/js/ads.js"></script>
</head>
<body>
  <div class="ambient-bg"></div>

  <header class="site-header scrolled">
    <div class="container header-inner">
      <a href="/" class="brand-logo">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </div>
        CINE<span>VORA</span>
      </a>

      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/anime.html" class="active">Anime</a></li>
        <li><a href="/movies.html">Movies</a></li>
        <li><a href="/series.html">Series</a></li>
        <li><a href="/search.html">Search</a></li>
      </ul>

      <div class="header-actions">
        <button class="search-trigger">Search...</button>
        <div id="header-user-actions"></div>
        <button class="mobile-toggle" aria-label="Toggle menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container" style="margin-top: 7rem; margin-bottom: 4rem;">
    <!-- Ad Slot ANIME_TOP -->
    <div data-ad-slot="ANIME_TOP"></div>

    <div class="section-header">
      <h1 class="section-title">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
        Anime Library
      </h1>
      <span style="color: var(--text-muted); font-size: 0.9rem;" id="catalog-count">Showing results</span>
    </div>

    <!-- Multi-Filter Bar -->
    <div class="glass-panel filter-bar">
      <div class="filter-group">
        <label class="filter-label">Genre</label>
        <select class="filter-select" id="genre-filter">
          <option value="">All Genres</option>
          <option value="Sci-Fi">Sci-Fi</option>
          <option value="Action">Action</option>
          <option value="Cyberpunk">Cyberpunk</option>
          <option value="Fantasy">Fantasy</option>
          <option value="Adventure">Adventure</option>
          <option value="Mecha">Mecha</option>
          <option value="Mystery">Mystery</option>
          <option value="Music">Music</option>
        </select>
      </div>

      <div class="filter-group">
        <label class="filter-label">Type</label>
        <select class="filter-select" id="type-filter">
          <option value="">All Types</option>
          <option value="SERIES">Series</option>
          <option value="MOVIE">Movie</option>
        </select>
      </div>

      <div class="filter-group">
        <label class="filter-label">Year</label>
        <select class="filter-select" id="year-filter">
          <option value="">All Years</option>
          <option value="2026">2026</option>
          <option value="2025">2025</option>
          <option value="2024">2024</option>
        </select>
      </div>

      <div class="filter-group">
        <label class="filter-label">Sort By</label>
        <select class="filter-select" id="sort-filter">
          <option value="newest">Newest Added</option>
          <option value="rating">Top Rated</option>
          <option value="popular">Most Popular</option>
        </select>
      </div>

      <div class="filter-group" style="justify-content: flex-end;">
        <button id="reset-filters-btn" class="btn btn-glass" style="margin-top: auto; padding: 0.65rem;">Reset Filters</button>
      </div>
    </div>

    <!-- Ad Slot ANIME_MIDDLE -->
    <div data-ad-slot="ANIME_MIDDLE"></div>

    <!-- Catalog Grid -->
    <div class="anime-grid" id="anime-catalog-grid">
      <div class="spinner"></div>
    </div>

    <!-- Ad Slot ANIME_BOTTOM -->
    <div data-ad-slot="ANIME_BOTTOM"></div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <div>&copy; 2026 Cinevora. Premium Anime Streaming.</div>
      <div>Designed for fast browsing and high quality streaming.</div>
    </div>
  </footer>

  <script type="module">
    import { API } from '/js/api.js?v=3';
    import { createAnimeCard } from '/js/app.js';

    const genreSelect = document.getElementById('genre-filter');
    const typeSelect = document.getElementById('type-filter');
    const yearSelect = document.getElementById('year-filter');
    const sortSelect = document.getElementById('sort-filter');
    const resetBtn = document.getElementById('reset-filters-btn');
    const grid = document.getElementById('anime-catalog-grid');
    const countEl = document.getElementById('catalog-count');

    // Parse URL Query Params
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('genre')) genreSelect.value = urlParams.get('genre');
    if (urlParams.has('type')) typeSelect.value = urlParams.get('type');

    async function fetchCatalog() {
      grid.innerHTML = '<div class="state-box" style="grid-column: 1 / -1;"><div class="spinner"></div></div>';
      try {
        const filters = {
          genre: genreSelect.value,
          type: typeSelect.value,
          year: yearSelect.value ? parseInt(yearSelect.value) : undefined,
          sort: sortSelect.value
        };

        const data = await API.getAnime(filters);
        countEl.textContent = `${data.count} titles found`;

        if (data.count === 0) {
          grid.innerHTML = `
            <div class="state-box glass-panel" style="grid-column: 1 / -1; padding: 3rem;">
              <h3 style="font-size: 1.25rem;">No anime found</h3>
              <p style="color: var(--text-muted);">Try adjusting or clearing your active filters.</p>
            </div>
          `;
        } else {
          grid.innerHTML = data.anime.map(item => createAnimeCard(item)).join('');
        }
      } catch (e) {
        grid.innerHTML = `<div class="state-box" style="grid-column: 1 / -1; color: #ef4444;">Failed to load catalog.</div>`;
      }
    }

    [genreSelect, typeSelect, yearSelect, sortSelect].forEach(el => {
      el.addEventListener('change', fetchCatalog);
    });

    resetBtn.addEventListener('click', () => {
      genreSelect.value = '';
      typeSelect.value = '';
      yearSelect.value = '';
      sortSelect.value = 'newest';
      fetchCatalog();
    });

    fetchCatalog();
  </script>
</body>
</html>
